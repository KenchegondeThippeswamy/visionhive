# Defaults suit a local cluster (Minikube). The values-*.yaml files change them per environment:
#   values-minikube.yaml  local cluster, images built inside Minikube, LocalStack and PostgreSQL in the cluster
#   values-dev.yaml       EKS dev    (real S3, SQS, RDS, ECR images, IRSA roles)
#   values-qa.yaml        EKS qa
#   values-prod.yaml      EKS prod

global:
  restartToken: "" # scripts set this to force a restart when the image tag does not change (local development)

image:
  registry: "" # empty = image already present in the cluster (Minikube). On EKS: the ECR registry URL
  repositoryPrefix: visionhive # image = registry/repositoryPrefix/service:tag
  tag: local
  pullPolicy: IfNotPresent

config:
  awsRegion: us-east-1
  s3Bucket: visionhive-videos
  s3Endpoint: http://localstack:4566 # empty = real AWS
  s3PublicEndpoint: http://localhost:4566
  sqsEndpoint: http://localstack:4566
  queueUrl: http://localstack:4566/000000000000/visionhive-jobs
  processSeconds: "5"

database:
  host: postgres
  name: visionhive
  user: visionhive
  existingSecret: # the password is never stored in Git: this Secret must already exist
    name: db-credentials
    key: password

aws:
  existingSecret: aws-local-credentials # fake LocalStack keys. Empty = use the pod's IAM role (IRSA)

postgres:
  enabled: true
  image: postgres:16
  storage: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

localstack:
  enabled: true
  image: localstack/localstack:3.8
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

serviceAccounts:
  create: false # true on EKS so each service can carry its own IAM role annotation

ingress:
  enabled: true
  className: nginx
  host: visionhive.local
  annotations: {} # set per environment (maps are merged with these defaults, so keep the defaults empty)

topologySpread:
  enabled: false # true on a multi-zone cluster: spread pods across zones

monitoring:
  serviceMonitor:
    enabled: false # true only when the Prometheus Operator CRDs exist (Phase 12)
    interval: 15s
    labels: {}

services:
  api-gateway:
    enabled: true
    port: 8080
    portName: http
    replicas: 2
    needsAws: false
    metricsPath: /metrics/
    readinessProbe:
      httpGet:
        path: /ready
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPU: 50
    pdb:
      enabled: true
      minAvailable: 1
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
  upload-svc:
    enabled: true
    port: 8001
    portName: http
    replicas: 1
    needsAws: true
    metricsPath: /metrics/
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: false
    pdb:
      enabled: false
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
  ingest-worker:
    enabled: true
    port: 8000
    portName: metrics
    replicas: 1
    needsAws: true
    metricsPath: /metrics/
    readinessProbe:
      tcpSocket:
        port: metrics
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      tcpSocket:
        port: metrics
      initialDelaySeconds: 15
      periodSeconds: 10
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
    hpa:
      enabled: false
    pdb:
      enabled: false
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []

{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "visionhive.labels" $ | nindent 4 }}
spec:
  {{- if not (and $svc.hpa $svc.hpa.enabled) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        {{- include "visionhive.labels" $ | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if $.Values.global.restartToken }}
        visionhive/restart-token: {{ $.Values.global.restartToken | quote }}
        {{- end }}
    spec:
      {{- if $.Values.serviceAccounts.create }}
      serviceAccountName: {{ $name }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $name }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "visionhive.image" (dict "root" $ "name" $name "svc" $svc) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: {{ $svc.portName }}
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: app-config
            {{- if and $svc.needsAws $.Values.aws.existingSecret }}
            - secretRef:
                name: {{ $.Values.aws.existingSecret }}
            {{- end }}
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.existingSecret.name }}
                  key: {{ $.Values.database.existingSecret.key }}
          readinessProbe:
            {{- toYaml $svc.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $svc.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
{{- end }}
{{- end }}

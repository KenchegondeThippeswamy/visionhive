{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    {{- include "visionhive.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: {{ $svc.portName }}
      port: {{ $svc.port }}
      targetPort: {{ $svc.portName }}
{{- end }}
{{- end }}

# Tells External Secrets how to read AWS Secrets Manager. No credentials here: it uses the IAM role
# of the External Secrets controller pod (IRSA).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2

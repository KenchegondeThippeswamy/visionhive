# Creates the Kubernetes Secret db-credentials from the password that RDS keeps in Secrets Manager.
# scripts/eks-bootstrap.sh replaces REPLACE_RDS_SECRET_ARN with the real ARN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: visionhive
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: REPLACE_RDS_SECRET_ARN
        property: password

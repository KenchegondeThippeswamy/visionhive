apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: visionhive
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - localstack.yaml
  - api-gateway.yaml
  - upload-svc.yaml
  - ingest-worker.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - init.sql=files/postgres-init.sql
  - name: localstack-init
    files:
      - init.sh=files/localstack-init.sh

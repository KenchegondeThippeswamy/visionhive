apiVersion: v1
kind: Service
metadata:
  name: ingest-worker
  labels:
    app: ingest-worker
spec:
  selector:
    app: ingest-worker
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  labels:
    app: ingest-worker
    app.kubernetes.io/part-of: visionhive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingest-worker
  template:
    metadata:
      labels:
        app: ingest-worker
        app.kubernetes.io/part-of: visionhive
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest-worker
          image: visionhive/ingest-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: aws-local-credentials
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

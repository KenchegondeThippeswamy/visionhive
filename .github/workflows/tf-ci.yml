name: terraform-ci
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/tf-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Validate root module (no backend, no AWS access needed)
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Security scan of Terraform code (report only)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "0" # change to "1" after you review the findings
